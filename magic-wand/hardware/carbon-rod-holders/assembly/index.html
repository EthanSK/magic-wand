<!doctype html>
<!-- One assembly viewer reads each revision's own meshes and motion recipe. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assembly | Magic Wand</title><link rel="icon" href="../../3d-viewer-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assembly.css?v=helper-actions"></head><body>
<main id="view"><span id="revision" class="tag">Magic Wand · Assembly</span><div id="error" role="alert"></div><div id="annotations" hidden></div><p class="hint">Drag to rotate · Scroll or pinch to zoom</p></main>
<aside><header class="component-picker"><h1>Wand Assembly</h1>
<label>Version<select id="version"></select></label>
<label>Component<select id="module"></select></label>
<label id="keys-view-options" hidden>Keys view<select id="keys-view"></select></label>
<div class="model-view-actions">
<button id="key-heights" hidden>Compare cap heights</button>
<button id="key-mechanism" aria-pressed="false" hidden>Show mechanism</button>
<button id="annotation-toggle" aria-controls="annotations" aria-expanded="true" hidden>Hide annotations</button>
<span id="model-actions" hidden></span></div></header>
<div class="assembly-details">
<p id="part-note" class="note"></p><div id="assembly"></div>
<details><summary>Parts and colours</summary><ul id="parts"></ul></details>
<h2>View</h2><div class="row" id="modes"><button data-mode="turn" aria-pressed="true">Rotate</button><button data-mode="move" aria-pressed="false">Pan</button><button data-mode="zoom" aria-pressed="false">Zoom</button></div>
<div class="row"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="reset">Reset view</button></div>
<label><input type="checkbox" id="wand-scroll"> Scroll rotates (wand override)</label>
<p class="note">Dimensions are in millimetres. Actual solder, wires and printed fit still need checking. Keep wires free and do not force a binding part.</p>
</div></aside><script type="module" src="viewer.mjs?v=helper-actions"></script></body></html>
