name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files, vendored files and privacy checks
        run: |
          python3 scripts/build.py --check
          python3 scripts/vendor.py --check
          python3 scripts/check.py
      - name: Tests
        run: node --test tests/*.test.*
